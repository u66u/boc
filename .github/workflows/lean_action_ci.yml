name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Gate - import DAG
        run: bash scripts/check_imports.sh
      - name: Gate - forbidden tokens
        run: bash scripts/forbidden_tokens.sh
      - name: Gate - no warnings
        run: |
          lake build 2>&1 | tee /tmp/build.log
          ! grep -iE '\bwarning\b' /tmp/build.log
      - name: Gate - pinned statements and axiom audit
        run: lake env lean Checks.lean
